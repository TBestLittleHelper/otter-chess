name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets publish.yml gate a PyPI release on this same suite instead of
  # duplicating the steps there.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The Python project root is package/, not the repo root.
      - name: Install package with dev dependencies
        run: pip install -e "./package[dev]"

      # tests/ stays at the repo root and imports the installed `otter_chess`.
      - name: Run tests
        run: pytest tests/ -v
